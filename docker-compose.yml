services:
  db:
    image: postgres:16-alpine
    container_name: faktury_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: faktury
      POSTGRES_PASSWORD: faktury
      POSTGRES_DB: faktury
    ports:
      - '5432:5432'
    volumes:
      - faktury_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faktury -d faktury']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faktury_pgdata:
